name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  typecheck:
    name: Type-check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      # The compiled output in dist/ is committed so the site works with no
      # build step. This job guards the TypeScript source against regressions.
      - name: Type-check (strict)
        run: npx tsc --noEmit

      # Guard against dist/ drifting out of sync with src/.
      - name: Verify dist/ is up to date
        run: |
          npx tsc --outDir /tmp/build
          diff -r /tmp/build dist --exclude="*.map"
